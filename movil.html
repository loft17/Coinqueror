<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coinqueror Modern</title>
    <style>
        :root {
            --bg: #0a0b0d;
            --surface: #1a1c22;
            --accent: #00f2ff;
            --text-main: #ffffff;
            --text-dim: #71717a;
            --success: #10b981;
            --error: #ef4444;
            --disabled: #27272a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .header {
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            z-index: 10;
        }

        .card {
            background: var(--surface);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .card span { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }

        /* --- HUB CENTRAL --- */
        .center-hub {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .combo-box {
            position: absolute;
            right: 20px;
            text-align: right;
            border-right: 3px solid var(--accent);
            padding-right: 12px;
        }
        .combo-value { font-size: 3rem; font-weight: 800; line-height: 1; color: var(--accent); }
        .combo-label { font-size: 10px; color: var(--text-dim); font-weight: bold; }

        #coin-box { perspective: 1000px; width: 120px; height: 120px; }
        #coin {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        .face {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .front { background: linear-gradient(135deg, #1e293b, #0f172a); color: var(--accent); }
        .back { background: linear-gradient(135deg, #18181b, #09090b); color: var(--text-dim); transform: rotateX(180deg); }

        @keyframes ultraToss {
            0% { transform: translateY(0) rotateX(0); }
            50% { transform: translateY(-280px) rotateX(1080deg); }
            100% { transform: translateY(0) rotateX(2160deg); }
        }
        .tossing { animation: ultraToss var(--dur) ease-in-out forwards; }

        /* --- CONTROLES --- */
        .controls {
            padding: 24px;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
        }

        #flip-btn {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        #flip-btn:disabled { opacity: 0.3; }

        .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .shop-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 10px 4px;
            border-radius: 10px;
            font-size: 10px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            transition: 0.3s;
        }

        /* Estado Desactivado */
        .shop-btn:disabled {
            background: var(--disabled);
            border-color: transparent;
            color: #3f3f46;
        }
        .shop-btn b { color: var(--accent); }
        .shop-btn:disabled b { color: #52525b; }

        /* --- TOAST --- */
        #toast-box { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000; }
        .toast {
            background: #000;
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- FINAL --- */
        #win-modal {
            position: fixed; inset: 0; background: var(--bg); z-index: 2000;
            display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
        }
        .win-stats { width: 100%; max-width: 300px; margin: 20px 0; }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1e1e1e; }

        .floating-text { position: absolute; font-weight: 800; font-size: 1.8rem; pointer-events: none; z-index: 100; text-shadow: 0 0 10px rgba(0,0,0,1); }
    </style>
</head>
<body>

    <div id="toast-box"></div>

    <div class="header">
        <div class="card">
            <label>Dinero</label>
            <span id="money">0</span>€
        </div>
        <div class="card">
            <label>Suerte</label>
            <span id="prob">5</span>%
        </div>
        <div class="card" style="grid-column: span 2; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <label>Valor Cara</label>
                <span id="gain">1</span>€
            </div>
            <div style="text-align: right;">
                <label>Multiplicador</label>
                <span id="mult" style="color: var(--success);">x1.0</span>
            </div>
        </div>
    </div>

    <div class="center-hub">
        <div id="coin-box">
            <div id="coin">
                <div class="face front">★</div>
                <div class="face back">†</div>
            </div>
        </div>
        <div class="combo-box">
            <div class="combo-label">COMBO</div>
            <div class="combo-value" id="streak">0</div>
        </div>
    </div>

    <div class="controls">
        <button id="flip-btn" onclick="flip()">LANZAR</button>
        <div class="shop-grid">
            <button class="shop-btn" id="b-p" onclick="buy('prob')">🍀 Suerte <b id="c-p">1€</b></button>
            <button class="shop-btn" id="b-s" onclick="buy('speed')">⚡ Vuelo <b id="c-s">1€</b></button>
            <button class="shop-btn" id="b-g" onclick="buy('gain')">💰 Valor <b id="c-g">1€</b></button>
        </div>
        <button onclick="resetGame()" style="width:100%; background:none; border:none; color:var(--text-dim); font-size:10px; margin-top:15px; letter-spacing: 1px;">RESET DATA</button>
    </div>

    <div id="win-modal">
        <h1 style="color:var(--accent); margin-bottom: 10px;">¡VICTORIA!</h1>
        <p>Has alcanzado las 15 caras seguidas.</p>
        <div class="win-stats" id="final-stats"></div>
        <button id="flip-btn" onclick="location.reload()">NUEVA PARTIDA</button>
    </div>

    <script>
        // LOGROS ORIGINALES RESTAURADOS
        const LOGROS_MASTER = [
            { id: "L1", label: "Tirar 1 vez", prize: 1, cond: () => totalFlips >= 1 },
            { id: "L2", label: "Tirar 10 veces", prize: 2, cond: () => totalFlips >= 10 },
            { id: "L3", label: "Tirar 100 veces", prize: 5, cond: () => totalFlips >= 100 },
            { id: "L4", label: "Tirar 500 veces", prize: 50, cond: () => totalFlips >= 500 },
            { id: "L5", label: "Tirar 1000 veces", prize: 100, cond: () => totalFlips >= 1000 },
            { id: "L6", label: "Tirar 2000 veces", prize: 1000, cond: () => totalFlips >= 2000 },
            { id: "L7", label: "Tirar 3000 veces", prize: 2000, cond: () => totalFlips >= 3000 },
            { id: "L12", label: "Primera cara", prize: 5, cond: () => totalHeads >= 1 },
            { id: "L13", label: "Racha 5 caras", prize: 500, cond: () => maxStreak >= 5 },
            { id: "L14", label: "Racha 10 caras", prize: 1000, cond: () => maxStreak >= 10 },
            { id: "L15", label: "Racha 15 caras", prize: 5000000, cond: () => maxStreak >= 15 },
            { id: "L16", label: "Ganar 10€", prize: 5, cond: () => money >= 10 },
            { id: "L17", label: "Ganar 50€", prize: 20, cond: () => money >= 20 },
            { id: "L18", label: "Ganar 100€", prize: 40, cond: () => money >= 50 },
            { id: "L19", label: "Ganar 500€", prize: 150, cond: () => money >= 75 },
            { id: "L20", label: "Ganar 1000€", prize: 300, cond: () => money >= 400 },
            { id: "L21", label: "Suerte al 50%", prize: 200, cond: () => prob >= 0.50 }
        ];

        let money = 0, prob = 0.05, speed = 1.5, gain = 1;
        let totalFlips = 0, totalHeads = 0, maxStreak = 0, currentStreak = 0;
        let costP = 1, costS = 1, costG = 1, totalSeconds = 0;
        let unlockedLogros = [];
        let isFlipping = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(f, t, d) {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            o.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        function flip() {
            if (isFlipping) return;
            isFlipping = true;
            totalFlips++;
            let result = Math.random() < prob;
            const coin = document.getElementById('coin');
            const btn = document.getElementById('flip-btn');

            coin.style.setProperty('--dur', speed + 's');
            coin.classList.add('tossing');
            btn.disabled = true;
            playSfx(400, 'sine', 0.2);

            setTimeout(() => {
                coin.classList.remove('tossing');
                if (result) {
                    let payout = Math.ceil(gain * (1 + currentStreak * 0.5));
                    currentStreak++;
                    totalHeads++;
                    if (currentStreak > maxStreak) maxStreak = currentStreak;
                    money += payout;
                    coin.style.transform = "rotateX(0deg)";
                    spawnFloating(`+${payout}€`, 'var(--success)');
                    playSfx(800, 'sine', 0.3);
                } else {
                    currentStreak = 0;
                    coin.style.transform = "rotateX(180deg)";
                    spawnFloating("FALLO", 'var(--error)');
                    playSfx(100, 'sawtooth', 0.3);
                }

                if (currentStreak >= 15) showVictory();
                checkLogros();
                updateUI();
                isFlipping = false;
                btn.disabled = false;
            }, speed * 1000);
        }

        function checkLogros() {
            LOGROS_MASTER.forEach(l => {
                if (!unlockedLogros.includes(l.id) && l.cond()) {
                    unlockedLogros.push(l.id);
                    money += l.prize;
                    const t = document.createElement('div');
                    t.className = 'toast';
                    t.innerHTML = `<span>🏆 ${l.label}</span><b>+${l.prize}€</b>`;
                    document.getElementById('toast-box').appendChild(t);
                    setTimeout(() => t.remove(), 4000);
                }
            });
        }

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(money).toLocaleString();
            document.getElementById('prob').innerText = Math.round(prob * 100);
            document.getElementById('gain').innerText = gain;
            document.getElementById('streak').innerText = currentStreak;
            document.getElementById('mult').innerText = `x${(1 + currentStreak * 0.5).toFixed(1)}`;
            
            document.getElementById('c-p').innerText = prob >= 1 ? "MAX" : costP + "€";
            document.getElementById('c-s').innerText = speed <= 0.3 ? "MAX" : costS + "€";
            document.getElementById('c-g').innerText = costG + "€";

            document.getElementById('b-p').disabled = money < costP || prob >= 1;
            document.getElementById('b-s').disabled = money < costS || speed <= 0.3;
            document.getElementById('b-g').disabled = money < costG;
        }

        function buy(type) {
            if (type === 'prob' && money >= costP) {
                money -= costP; prob = parseFloat((prob + 0.01).toFixed(2)); costP = Math.ceil(costP * 1.1);
            } else if (type === 'speed' && money >= costS) {
                money -= costS; speed = parseFloat((speed - 0.2).toFixed(1)); costS = Math.ceil(costS * 1.3);
            } else if (type === 'gain' && money >= costG) {
                money -= costG; gain += 1; costG = Math.ceil(costG * 1.1);
            }
            updateUI();
        }

        function spawnFloating(txt, color) {
            const el = document.createElement('div');
            el.className = 'floating-text'; el.innerText = txt; el.style.color = color;
            el.style.left = '50%'; el.style.top = '40%';
            document.body.appendChild(el);
            el.animate([{opacity:1, transform:'translate(-50%, 0)'}, {opacity:0, transform:'translate(-50%, -100px)'}], 1000).onfinish = () => el.remove();
        }

        function showVictory() {
            const modal = document.getElementById('win-modal');
            const stats = document.getElementById('final-stats');
            const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            stats.innerHTML = `
                <div class="row"><span>Tiempo Total</span><b>${h}:${m}:${s}</b></div>
                <div class="row"><span>Lanzamientos</span><b>${totalFlips}</b></div>
                <div class="row"><span>Total Caras</span><b>${totalHeads}</b></div>
                <div class="row"><span>Logros</span><b>${unlockedLogros.length}/${LOGROS_MASTER.length}</b></div>
            `;
            modal.style.display = 'flex';
        }

        function resetGame() { if(confirm("¿Reiniciar?")) location.reload(); }
        setInterval(() => totalSeconds++, 1000);
        updateUI();
    </script>
</body>
</html>
