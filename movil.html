<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coinqueror Mobile</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23FFD700' stroke='%23D49000' stroke-width='4'/><polygon points='50,20 58,39 79,39 62,53 68,74 50,62 32,74 38,53 21,39 42,39' fill='%23996500'/></svg>">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body {
            height: 100vh; font-family: 'Courier New', Courier, monospace;
            background: #0a0a0a url("https://www.transparenttextures.com/patterns/dark-leather.png");
            overflow: hidden; color: #f5e6c8; display: flex; flex-direction: column;
        }

        /* ESTADÍSTICAS SUPERIORES */
        .panel-stats {
            background: rgba(15, 10, 5, 0.95); border-bottom: 2px solid #5a3d00;
            padding: 12px; z-index: 100; font-size: 0.75rem;
        }
        .money-main { font-size: 1.8rem; text-align: center; color: #ffd700; font-weight: bold; margin-bottom: 8px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
        .stats-grid div { display: flex; justify-content: space-between; border-bottom: 1px solid #332200; padding: 2px 0; }
        .stats-grid span { color: #ffd700; font-weight: bold; }

        /* ÁREA DE JUEGO */
        .game-area {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            perspective: 1000px; -webkit-perspective: 1000px; position: relative;
        }

        #instruction {
            position: absolute; top: 10%; color: #ffd700; text-align: center;
            width: 80%; font-weight: bold; line-height: 1.4;
        }
        .goal-txt { font-size: 0.7rem; color: #f5e6c8; display: block; margin-top: 5px; opacity: 0.8; }


        #instruction.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* MONEDA - GIRO VERTICAL */
        #coin-wrapper {
            width: 150px; height: 150px;
            transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
        }

        #coin {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .face {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            border: 4px solid rgba(0,0,0,0.5);
        }

        .front { background: radial-gradient(circle, #ffd700, #b8860b); transform: translateZ(5px); -webkit-transform: translateZ(5px); }
        .front::after { content: "★"; font-size: 60px; color: rgba(0,0,0,0.3); }
        .back { background: radial-gradient(circle, #c0c0c0, #666); transform: rotateX(180deg) translateZ(5px); -webkit-transform: rotateX(180deg) translateZ(5px); }
        .back::after { content: "†"; font-size: 60px; color: rgba(0,0,0,0.3); }

        @keyframes toss-vertical {
            0% { transform: translateY(0) rotateX(0); }
            50% { transform: translateY(-200px) rotateX(900deg); }
            100% { transform: translateY(0) rotateX(1800deg); }
        }
        .tossing { animation: toss-vertical var(--dur) ease-in-out forwards; }

        /* TIENDA */
        .shop {
    background: rgba(15, 10, 5, 0.95);
    border-top: 2px solid #5a3d00;
    padding: 10px 10px 5px 10px; /* Reducido para dejar sitio al footer */
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: auto; /* Empuja la tienda hacia abajo */
}
        button {
            background: #3d2a00; color: #f5e6c8; border: 1px solid #ffd700;
            padding: 12px 4px; font-family: inherit; font-size: 0.65rem; text-transform: uppercase;
        }
        button:disabled { opacity: 0.3; color: #666; border-color: #332200; }
/* BOTÓN RESET PEQUEÑO Y ROJO */
.btn-reset {
    grid-column: span 2;
    background: transparent;
    color: #cc4444; /* Rojo suave */
    margin: 8px auto 2px auto;
    border: 1px solid #442222;
    font-size: 0.55rem;
    padding: 4px 12px;
    width: fit-content;
    border-radius: 3px;
    text-transform: uppercase;
    opacity: 0.8;
}

.btn-reset:active {
    background: #4a0000;
    color: white;
}

        /* OVERLAY VICTORIA */
        #win-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; text-align: center; padding: 20px;
        }
        .win-box { border: 3px solid #ffd700; padding: 30px; background: #1a150a; border-radius: 10px; }
        .win-title { color: #ffd700; font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 20px #ffd700; }
        .win-btn { width: 100%; margin: 10px 0; padding: 15px; font-weight: bold; }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .floating-text { position: absolute; font-weight: bold; pointer-events: none; z-index: 200; font-size: 1.4rem; text-shadow: 2px 2px #000; }
        .achievement-toast {
            position: fixed; top: 10px; left: 10px; right: 10px; background: #1a150a;
            border: 2px solid #ffd700; padding: 10px; z-index: 1000; text-align: center; font-size: 0.8rem;
        }

/* FOOTER DE CRÉDITOS */
.game-footer {
    background: rgba(15, 10, 5, 0.95);
    text-align: center;
    font-size: 0.5rem;
    color: #555;
    padding-bottom: 15px; /* Espacio extra para notch de móviles */
    letter-spacing: 1px;
}
.game-footer a { color: #666; text-decoration: none; }

    </style>
</head>
<body>

<div id="win-overlay">
    <div class="win-box">
        <h1 class="win-title">¡WIN!</h1>
        <p>Has conseguido las 15 caras seguidas.</p>
        <button class="win-btn" onclick="continuePlaying()" style="background: #3d2a00;">CONTINUAR JUGANDO</button>
        <button class="win-btn" onclick="resetGame()" style="background: #4a0000; border-color: #f00;">REINICIAR TODO</button>
    </div>
</div>

<div id="toast-container"></div>

<div class="panel-stats">
    <div class="money-main"><span id="money">0</span>€</div>
    <div class="stats-grid">
        <div>VALOR: <span id="currentGainDisplay">1</span>€</div>
        <div>LOGROS: <span id="logroCount">0/21</span></div>
        <div>TIRADAS: <span id="tFlips">0</span></div>
        <div>RACHA: <span id="currentStreakDisplay">0</span>/15</div>
        <div>SUERTE: <span id="probDisplay">0</span>%</div>
        <div>VUELO: <span id="timeDisplay">3.5</span>s</div>
    </div>
</div>

<div class="game-area" onclick="flip()">
    <div id="instruction">
        PULSA PARA LANZAR
        <span class="goal-txt">OBJETIVO: 15 CARAS SEGUIDAS</span>
    </div>
    <div id="coin-wrapper">
        <div id="coin">
            <div class="face front"></div>
            <div class="face back"></div>
        </div>
    </div>
</div>

<div class="shop">
    <button id="btn-prob" onclick="event.stopPropagation(); buy('prob')">🍀 Suerte (<span id="cProb">1€</span>)</button>
    <button id="btn-speed" onclick="event.stopPropagation(); buy('time')">⚡ Vuelo (<span id="cTime">1€</span>)</button>
    <button id="btn-gain" onclick="event.stopPropagation(); buy('gain')" style="grid-column: span 2;">💰 Valor Base +1€ (<span id="cGain">1€</span>)</button>
    <button class="btn-reset" onclick="event.stopPropagation(); resetGame()">Reiniciar Progreso</button>
</div>

<div class="game-footer">
    © 2026 <a href="https://joseromera.es" target="_blank">joseromera.es</a> | v1.2.0
</div>

<script>
    // Usamos un closure o simplemente aseguramos que las funciones sean globales
    // En navegadores móviles, a veces el parseo falla si hay errores de sintaxis arriba.

    let saved = JSON.parse(localStorage.getItem('coin_save_mob_v3')) || {};
    let money = saved.money || 0;
    let prob = saved.prob || 0.01;
    let speed = saved.speed || 3.5;
    let gain = saved.gain || 1;
    let totalFlips = saved.totalFlips || 0;
    let maxStreak = saved.maxStreak || 0;
    let costP = saved.costP || 1;
    let costS = saved.costS || 1;
    let costG = saved.costG || 1;
    let unlockedLogros = saved.unlockedLogros || [];
    let gameWon = saved.gameWon || false;

    let currentStreak = 0;
    let isFlipping = false;

    // DEFINIMOS LA FUNCIÓN CLAVE
    window.flip = function() {
        if (isFlipping) return;

        const inst = document.getElementById('instruction');
        if (inst) {
            inst.classList.add('hidden');
            setTimeout(() => { if(inst.parentNode) inst.remove(); }, 500);
        }

        isFlipping = true;
        totalFlips++;

        const wrapper = document.getElementById('coin-wrapper');
        const coin = document.getElementById('coin');
        let result = Math.random() < prob;

        wrapper.classList.remove('tossing');
        void wrapper.offsetWidth; // Force reflow

        wrapper.style.setProperty('--dur', speed + 's');
        wrapper.classList.add('tossing');

        setTimeout(() => {
            wrapper.classList.remove('tossing');
            if (result) {
                currentStreak++;
                if (currentStreak > maxStreak) maxStreak = currentStreak;

                let mult = 1 + (currentStreak - 1) * 0.35;
                let payout = Math.ceil(gain * mult);
                money += payout;
                coin.style.transform = "rotateX(0deg)";
                showFT(`+${payout}€`, '#0f0');

                if (currentStreak >= 15 && !gameWon) {
                    showWin();
                }
            } else {
                currentStreak = 0;
                coin.style.transform = "rotateX(180deg)";
                showFT("FALLO", "#f30");
            }
            checkLogros();
            updateUI();
            saveGame();
            isFlipping = false;
        }, speed * 1000);
    };

    // DEFINIMOS EL RESTO DE FUNCIONES COMO GLOBALES PARA LOS ONCLICK
    window.buy = function(type) {
        if (type === 'prob' && money >= costP && prob < 1) {
            money -= costP;
            prob = parseFloat((prob + 0.01).toFixed(2));
            costP = Math.ceil(costP * 1.5);
        } else if (type === 'time' && money >= costS && speed > 0.4) {
            money -= costS;
            speed = parseFloat((speed - 0.2).toFixed(1));
            costS = Math.ceil(costS * 1.8);
        } else if (type === 'gain' && money >= costG) {
            money -= costG;
            gain++;
            costG = Math.ceil(costG * 1.4);
        }
        updateUI();
        saveGame();
    };

    function showWin() {
        gameWon = true;
        document.getElementById('win-overlay').style.display = 'flex';
    }

    window.continuePlaying = function() {
        document.getElementById('win-overlay').style.display = 'none';
        saveGame();
    };

    function checkLogros() {
        const metas = [1, 10, 100, 500, 1000];
        metas.forEach(m => {
            let id = "T"+m;
            if (totalFlips >= m && !unlockedLogros.includes(id)) {
                unlockedLogros.push(id);
                money += (m * 2);
                showToast(`¡Logro: ${m} lanzamientos!`);
            }
        });
    }

    function updateUI() {
        document.getElementById('money').innerText = Math.floor(money);
        document.getElementById('tFlips').innerText = totalFlips;
        document.getElementById('currentStreakDisplay').innerText = currentStreak;
        document.getElementById('probDisplay').innerText = Math.round(prob * 100);
        document.getElementById('timeDisplay').innerText = speed.toFixed(1);
        document.getElementById('logroCount').innerText = `${unlockedLogros.length}/21`;

        document.getElementById('cProb').innerText = prob >= 1 ? "MAX" : costP + "€";
        document.getElementById('cTime').innerText = speed <= 0.4 ? "MAX" : costS + "€";
        document.getElementById('cGain').innerText = costG + "€";

        document.getElementById('btn-prob').disabled = (money < costP || prob >= 1);
        document.getElementById('btn-speed').disabled = (money < costS || speed <= 0.4);
        document.getElementById('btn-gain').disabled = (money < costG);

        let currentMult = 1 + (currentStreak * 0.35);
        document.getElementById('currentGainDisplay').innerText = Math.ceil(gain * (currentStreak > 0 ? currentMult : 1));
    }

    function showFT(txt, color) {
        const el = document.createElement('div');
        el.className = 'floating-text'; el.innerText = txt;
        el.style.left = '50%'; el.style.top = '45%'; el.style.color = color;
        document.body.appendChild(el);
        el.animate([{transform:'translate(-50%, 0)', opacity:1}, {transform:'translate(-50%, -100px)', opacity:0}], 1000);
        setTimeout(() => el.remove(), 1000);
    }

    function showToast(txt) {
        const t = document.createElement('div');
        t.className = 'achievement-toast'; t.innerText = txt;
        const container = document.getElementById('toast-container');
        if(container) container.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    function saveGame() {
        const data = { money, prob, speed, gain, totalFlips, maxStreak, costP, costS, costG, unlockedLogros, gameWon };
        localStorage.setItem('coin_save_mob_v3', JSON.stringify(data));
    }

    window.resetGame = function() {
        if(confirm("¿Reiniciar progreso?")) {
            localStorage.clear();
            location.reload();
        }
    };

    // Iniciar UI
    updateUI();
</script>

</body>
</html>
