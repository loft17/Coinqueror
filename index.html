<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Coinqueror</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            height:100vh; font-family: 'Courier New', Courier, monospace;
            background: #0a0a0a url("https://www.transparenttextures.com/patterns/dark-leather.png");
            overflow:hidden; color:#f5e6c8;
        }
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, black 150%);
            pointer-events: none; z-index: 100;
        }
        .panel {
            background: rgba(15, 10, 5, 0.9); border: 2px solid #5a3d00;
            padding: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: absolute; z-index: 20;
        }
        .stats { top: 20px; left: 20px; width: 280px; }
        .achievements { bottom: 20px; left: 20px; width: 320px; height: 250px; overflow-y: auto; }
        .shop { right: 20px; bottom: 50px; width: 280px; }

        /* COPYRIGHT */
        .footer-info {
            position: fixed; bottom: 10px; right: 15px;
            font-size: 0.65rem; color: white; opacity: 0.6;
            z-index: 1001; text-align: right; pointer-events: none;
        }

        /* EFECTO SACUDIDA */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .apply-shake { animation: shake 0.5s; }

        #achievement-toast-container {
            position: fixed; top: 20px; right: 20px; width: 300px;
            z-index: 1000; display: flex; flex-direction: column; gap: 10px;
        }
        .achievement-toast {
            background: #1a150a; border: 2px solid #ffd700; padding: 12px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            animation: slideIn 0.5s ease-out forwards;
            position: relative; overflow: hidden;
        }
        .achievement-toast h4 { color: #ffd700; font-size: 0.9rem; margin-bottom: 4px; }
        .achievement-toast p { font-size: 0.8rem; margin: 0; color: #f5e6c8; }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        h3 { color: #ffd700; border-bottom: 1px solid #5a3d00; margin-bottom: 10px; font-size: 1rem; text-transform: uppercase; display: flex; justify-content: space-between; }
        p { margin: 5px 0; font-size: 0.85rem; display: flex; justify-content: space-between; }
        span { color: #ffd700; font-weight: bold; }
        button {
            width: 100%; margin: 5px 0; padding: 8px;
            background: #3d2a00; color: #f5e6c8;
            border: 1px solid #1a1100; cursor: pointer;
            text-transform: uppercase; transition: 0.2s; font-family: inherit;
        }
        button:hover:not(:disabled) { background: #5a3d00; border-color: #ffd700; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        #flip-btn {
            width: 250px; padding: 15px; font-size: 1.1rem; font-weight: bold;
            background: #ffd700; color: #000; border: 2px solid #b8860b; margin-bottom: 20px;
        }
        .btn-reset { margin-top: 15px; background: #4a0000; border-color: #2a0000; font-size: 0.7rem; }
        .game-area {
            position: absolute; bottom: 0; left: 0; right: 0; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            perspective: 1500px; padding-bottom: 40px;
        }
        #jump-engine { transform-style: preserve-3d; }
        #coin {
            position: relative; width: 130px; height: 130px;
            transform-style: preserve-3d; transition: transform 0.4s ease-out; margin-bottom: 50px;
        }
        .face {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            backface-visibility: hidden; border: 3px solid rgba(0,0,0,0.4);
        }
        .front { background: radial-gradient(circle, #ffd700, #b8860b); transform: translateZ(5px); }
        .front::after { content: "★"; font-size: 50px; color: rgba(0,0,0,0.3); }
        .back { background: radial-gradient(circle, #c0c0c0, #666); transform: rotateX(180deg) translateZ(5px); }
        .back::after { content: "†"; font-size: 50px; color: rgba(0,0,0,0.3); }
        .side { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: #8a6d00; }
        @keyframes tossRealista {
            0% { transform: translateY(0) rotateX(0); }
            50% { transform: translateY(-400px) rotateX(1080deg); }
            100% { transform: translateY(0) rotateX(2160deg); }
        }
        .tossing { animation: tossRealista var(--dur) forwards ease-in-out; }
        .logro-item { font-size: 0.7rem; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(90, 61, 0, 0.3); padding-bottom: 4px; }
        .locked { color: #555; }
        .unlocked { color: #f5e6c8; font-weight: bold; }
        .premio-tag { color: #ffd700; font-weight: bold; margin-left: 10px; border: 1px solid #ffd700; padding: 0 4px; border-radius: 3px; font-size: 0.6rem; }
        .conseguido-tag { color: #0f0; font-weight: bold; font-size: 0.6rem; }
        .floating-text { position: absolute; font-weight: bold; font-size: 1.8rem; pointer-events: none; z-index: 50; text-shadow: 2px 2px 4px black; text-align: center; }
    </style>
</head>
<body id="main-body">

<div id="achievement-toast-container"></div>

<div class="panel stats">
    <h3>CONTABILIDAD</h3>
    <p>Tiempo Juego: <span id="gameTimeDisplay">00:00:00</span></p>
    <p>Dinero: <span id="money">0</span>€</p>
    <p>Valor Cara: <span id="currentGainDisplay">1</span>€</p>
    <p>Multiplicador: <span id="streakMultDisplay">x1.0</span></p>
    <hr style="border:0; border-bottom:1px solid #332200; margin:5px 0;">
    <p>Lanzamientos: <span id="tFlips">0</span></p>
    <p>Total Caras: <span id="tHeads">0</span></p>
    <p>Racha Máx: <span id="maxStreak">0</span></p>
    <p>Suerte: <span id="prob">5</span>%</p>
    <p>Vuelo Moneda: <span id="timeDisplay">3.5</span>s</p>
</div>

<div class="panel achievements">
    <h3>LOGROS <span id="logroCount">0/21</span></h3>
    <div id="logList"></div>
</div>

<div class="game-area">
    <div id="jump-engine">
        <div id="coin">
            <div class="side" style="transform: translateZ(1px)"></div>
            <div class="side" style="transform: translateZ(2px)"></div>
            <div class="side" style="transform: translateZ(3px)"></div>
            <div class="side" style="transform: translateZ(4px)"></div>
            <div class="face front"></div>
            <div class="face back"></div>
        </div>
    </div>
    <button id="flip-btn" onclick="flip()">LANZAR AL AIRE</button>
</div>

<div class="panel shop">
    <h3>TIENDA</h3>
    <button id="btn-prob" onclick="buy('prob')">🍀 Suerte +1% (<span id="cProb">1</span>€)</button>
    <button id="btn-speed" onclick="buy('time')">⚡ Vuelo -0.2s (<span id="cTime">1</span>€)</button>
    <button id="btn-gain" onclick="buy('gain')">💰 Valor +1€ (<span id="cGain">1</span>€)</button>
    <button class="btn-reset" onclick="resetGame()">🔥 REFORMA TOTAL</button>
    <div style="display: flex; gap: 5px;">
        <button onclick="exportSave()" style="font-size:0.7rem; background:#1a3a1a">💾 EXPORTAR</button>
        <button onclick="importSave()" style="font-size:0.7rem; background:#1a3a1a">📥 IMPORTAR</button>
    </div>
</div>

<div class="footer-info">
    joseromera.es | v1.2.0
</div>

<script>
    const SALT = "RUINOSO_2026_";
    const LOGROS_MASTER = [
        { id: "L1", label: "Tirar 1 vez", prize: 1, cond: () => totalFlips >= 1 },
        { id: "L2", label: "Tirar 10 veces", prize: 2, cond: () => totalFlips >= 10 },
        { id: "L3", label: "Tirar 100 veces", prize: 5, cond: () => totalFlips >= 100 },
        { id: "L4", label: "Tirar 500 veces", prize: 100, cond: () => totalFlips >= 500 },
        { id: "L5", label: "Tirar 1000 veces", prize: 500, cond: () => totalFlips >= 1000 },
        { id: "L6", label: "Tirar 2000 veces", prize: 1000, cond: () => totalFlips >= 2000 },
        { id: "L7", label: "Tirar 3000 veces", prize: 2000, cond: () => totalFlips >= 3000 },
        { id: "L8", label: "Tirar 4000 veces", prize: 3000, cond: () => totalFlips >= 4000 },
        { id: "L9", label: "Tirar 5000 veces", prize: 4000, cond: () => totalFlips >= 5000 },
        { id: "L10", label: "Tirar 6000 veces", prize: 5000, cond: () => totalFlips >= 6000 },
        { id: "L11", label: "Tirar 7000 veces", prize: 6000, cond: () => totalFlips >= 7000 },
        { id: "L12", label: "Primera cara", prize: 5, cond: () => totalHeads >= 1 },
        { id: "L13", label: "Racha 5 caras", prize: 500, cond: () => maxStreak >= 5 },
        { id: "L14", label: "Racha 10 caras", prize: 6000, cond: () => maxStreak >= 10 },
        { id: "L15", label: "Racha 15 caras", prize: 500000, cond: () => maxStreak >= 15 },
        { id: "L16", label: "Ganar 10€", prize: 5, cond: () => money >= 10 },
        { id: "L17", label: "Ganar 50€", prize: 20, cond: () => money >= 50 },
        { id: "L18", label: "Ganar 100€", prize: 40, cond: () => money >= 100 },
        { id: "L19", label: "Ganar 500€", prize: 150, cond: () => money >= 500 },
        { id: "L20", label: "Ganar 1000€", prize: 300, cond: () => money >= 1000 },
        { id: "L21", label: "Suerte al 50%", prize: 2000, cond: () => prob >= 0.50 }
    ];

    let saved = JSON.parse(localStorage.getItem('bar_save')) || {};
    let money = saved.money || 0;
    let prob = saved.prob || 0.01;
    let speed = saved.speed || 3.5;
    let gain = saved.gain || 1;
    let totalFlips = saved.totalFlips || 0;
    let totalHeads = saved.totalHeads || 0;
    let maxStreak = saved.maxStreak || 0;
    let costP = saved.costP || 1;
    let costS = saved.costS || 1;
    let costG = saved.costG || 1;
    let totalSeconds = saved.totalSeconds || 0;
    let unlockedLogros = saved.unlockedLogros || [];

    let currentStreak = 0;
    let isFlipping = false;
    let isResetting = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'toss') {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'win') {
            // EFECTO SACO DE MONEDAS (RUIDO METÁLICO)
            for(let i=0; i<8; i++) {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc.type = 'sine';
                const startTime = now + (i * 0.04);
                osc.frequency.setValueAtTime(1500 + Math.random()*2000, startTime);
                gainNode.gain.setValueAtTime(0.1, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.1);
                osc.start(startTime); osc.stop(startTime + 0.1);
            }
        } else if (type === 'lose') {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'achievement') {
            [440, 554, 659, 880].forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sine'; o.frequency.setValueAtTime(f, now + (i * 0.1));
                g.gain.setValueAtTime(0.1, now + (i * 0.1));
                g.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.1) + 0.3);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(now + (i * 0.1)); o.stop(now + (i * 0.1) + 0.3);
            });
        }
    }

    function showAchievementToast(label, prize) {
        const container = document.getElementById('achievement-toast-container');
        const toast = document.createElement('div');
        toast.className = 'achievement-toast';
        toast.innerHTML = `
            <h4>🏆 ¡LOGRO DESBLOQUEADO!</h4>
            <p>${label}</p>
            <p style="color:#ffd700; font-weight:bold; margin-top:5px;">+${prize}€ añadidos</p>
        `;
        container.appendChild(toast);
        playSound('achievement');
        setTimeout(() => {
            toast.style.animation = 'slideOut 0.5s ease-in forwards';
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }

    function saveGame() {
        if (isResetting) return;
        const data = { money, prob, speed, gain, totalFlips, totalHeads, maxStreak, costP, costS, costG, totalSeconds, unlockedLogros };
        localStorage.setItem('bar_save', JSON.stringify(data));
    }

    function formatTime() {
        const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
        const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
        const s = (totalSeconds % 60).toString().padStart(2, '0');
        document.getElementById('gameTimeDisplay').innerText = `${h}:${m}:${s}`;
    }

    setInterval(() => {
        if (isResetting) return;
        totalSeconds++; formatTime();
        if (totalSeconds % 5 === 0) saveGame();
    }, 1000);

    function renderLogros() {
        const logDiv = document.getElementById('logList');
        logDiv.innerHTML = "";
        LOGROS_MASTER.forEach(l => {
            const ok = unlockedLogros.includes(l.id);
            const item = document.createElement('div');
            item.className = `logro-item ${ok ? 'unlocked' : 'locked'}`;
            item.innerHTML = `<span>${ok ? '<span style="color:#0f0">✔</span>' : '○'} ${l.label}</span>
                              ${ok ? '<span class="conseguido-tag">PAGADO</span>' : `<span class="premio-tag">+${l.prize}€</span>`}`;
            logDiv.appendChild(item);
        });
        document.getElementById('logroCount').innerText = `${unlockedLogros.length}/${LOGROS_MASTER.length}`;
    }

    function showFloatingText(txt, color) {
        const el = document.createElement('div');
        el.className = 'floating-text'; el.innerText = txt;
        const randomX = (Math.random() * 100 - 50);
        el.style.left = `calc(50% + ${randomX}px)`;
        el.style.bottom = '280px'; el.style.color = color;
        document.querySelector('.game-area').appendChild(el);
        el.animate([{opacity:1, transform:'translateY(0)'}, {transform:'translateY(-150px)', opacity:0}], 1200);
        setTimeout(() => el.remove(), 1200);
    }

    function flip() {
        if (isFlipping) return;
        isFlipping = true;
        playSound('toss');
        const engine = document.getElementById('jump-engine');
        const coin = document.getElementById('coin');
        const btn = document.getElementById('flip-btn');
        totalFlips++;
        let result = Math.random() < prob;
        engine.style.setProperty('--dur', speed + 's');
        engine.classList.add('tossing');
        btn.disabled = true;

        setTimeout(() => {
            engine.classList.remove('tossing');
            if (result) {
                playSound('win'); totalHeads++; currentStreak++;
                if (currentStreak > maxStreak) maxStreak = currentStreak;

                // Efecto de sacudida a partir de racha 10
                if(currentStreak >= 10) {
                    const body = document.getElementById('main-body');
                    body.classList.add('apply-shake');
                    setTimeout(() => body.classList.remove('apply-shake'), 500);
                }

                let payout = Math.ceil(gain * (1 + (currentStreak - 1) * 0.35));
                money += payout;
                coin.style.transform = "rotateX(0deg)";
                showFloatingText(`CARA! +${payout}€`, '#00ff00');
            } else {
                playSound('lose'); currentStreak = 0;
                coin.style.transform = "rotateX(180deg)";
                showFloatingText("FALLO", "#ff3300");
            }
            checkLogros(); updateUI(); saveGame();
            isFlipping = false; btn.disabled = false;
        }, speed * 1000);
    }

    function checkLogros() {
        LOGROS_MASTER.forEach(l => {
            if (!unlockedLogros.includes(l.id) && l.cond()) {
                unlockedLogros.push(l.id);
                money += l.prize;
                showAchievementToast(l.label, l.prize);
                renderLogros();
            }
        });
    }

    function buy(type) {
        if (type === 'prob' && money >= costP && prob < 1) {
            money -= costP;
            prob = Math.min(1, parseFloat((prob + 0.01).toFixed(2)));
            costP = Math.ceil(costP * 1.1);
        }
        if (type === 'time' && money >= costS && speed > 0.3) {
            money -= costS;
            speed = parseFloat((speed - 0.2).toFixed(1));
            if (speed < 0.3) speed = 0.3;
            costS = Math.ceil(costS * 1.3);
        }
        if (type === 'gain' && money >= costG) {
            money -= costG;
            gain += 1;
            costG = Math.ceil(costG * 1.1);
        }
        updateUI(); saveGame();
    }

    function updateUI() {
        document.getElementById('money').innerText = Math.floor(money);
        document.getElementById('tFlips').innerText = totalFlips;
        document.getElementById('tHeads').innerText = totalHeads;
        document.getElementById('maxStreak').innerText = maxStreak;
        document.getElementById('prob').innerText = Math.round(prob * 100);
        document.getElementById('timeDisplay').innerText = speed.toFixed(1);
        document.getElementById('cGain').innerText = costG;

        const btnProb = document.getElementById('btn-prob');
        if (prob >= 1) {
            document.getElementById('cProb').innerText = "MAX";
            btnProb.disabled = true;
        } else {
            document.getElementById('cProb').innerText = costP;
            btnProb.disabled = money < costP;
        }

        const btnSpeed = document.getElementById('btn-speed');
        if (speed <= 0.3) {
            document.getElementById('cTime').innerText = "MAX";
            btnSpeed.disabled = true;
        } else {
            document.getElementById('cTime').innerText = costS;
            btnSpeed.disabled = money < costS;
        }

        document.getElementById('btn-gain').disabled = money < costG;
        let mult = 1 + (currentStreak * 0.1);
        document.getElementById('streakMultDisplay').innerText = `x${mult.toFixed(1)}`;
        document.getElementById('currentGainDisplay').innerText = Math.ceil(gain * mult);
    }

    function exportSave() {
        saveGame();
        const code = btoa(unescape(encodeURIComponent(SALT + JSON.stringify(JSON.parse(localStorage.getItem('bar_save'))))));
        prompt("Copia tu código de guardado:", code);
    }

    function importSave() {
        const c = prompt("Pega tu código:");
        if(!c) return;
        try {
            const d = decodeURIComponent(escape(atob(c)));
            if (d.startsWith(SALT)) {
                localStorage.setItem('bar_save', d.replace(SALT, ""));
                location.reload();
            }
        } catch(e) { alert("Error"); }
    }

    function resetGame() {
        if(confirm("¿Reset total?")) {
            isResetting = true;
            localStorage.removeItem('bar_save');
            location.reload();
        }
    }

    renderLogros();
    updateUI();
</script>
</body>
</html>
